name: render-chart
on:
  schedule:
    - cron: "17 5 * * *"          # once a day, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-branch              # shared with log-readings so they never push together
  cancel-in-progress: false

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4              # main branch: scripts/plot.py
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install matplotlib
        run: pip install matplotlib
      - name: Render chart
        # arguments: csv, output png, days to plot, timezone for the axis
        run: python scripts/plot_data.py data-branch/data.csv data-branch/chart.png 7 UTC
      - name: Commit chart
        working-directory: data-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "update chart"
          git pull --rebase origin data
          git push origin HEAD:data